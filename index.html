<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Platform App - Pro Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

    <!-- AUTHENTICATION VIEW -->
    <div id="auth-view" class="view active">
        <div class="auth-overlay">
            <div class="auth-card pulse-glow">
                <div class="logo-icon scale-in">P</div>
                <h2 id="auth-title">Welcome to Platform</h2>
                <p id="auth-sub" style="color: #aaa; font-size: 13px; margin-bottom: 20px;">Sign in or create an account to start</p>

                <form id="auth-form">
                    <input type="email" id="auth-email" class="glass-input" placeholder="Email address" required>
                    <input type="password" id="auth-password" class="glass-input" placeholder="Password" required>
                    <button type="submit" id="auth-submit-btn" class="glass-btn primary">Sign In</button>
                </form>

                <div class="auth-toggle" style="margin-top: 16px; text-align: center;">
                    <span id="toggle-auth-btn" style="color: var(--accent); cursor: pointer; font-size: 13px;" onclick="toggleAuthMode()">Don't have an account? Sign Up</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- HOME VIEW -->
    <div id="home-view" class="view">
        <div class="header">
            <div class="header-left">
                <div class="logo-icon">P</div> Platform
            </div>
            <div class="header-right">
                <i class="fa-regular fa-compass" onclick="switchView('explore')"></i>
                <i class="fa-regular fa-paper-plane" onclick="switchView('messages')"></i>
            </div>
        </div>
        
        <!-- Post Composer -->
        <div class="composer-card">
            <textarea id="composer-text" placeholder="What's happening?" rows="2"></textarea>
            <div class="composer-actions">
                <label for="composer-file" class="file-picker-label">
                    <i class="fa-solid fa-photo-film"></i> Media
                </label>
                <input type="file" id="composer-file" accept="image/*,video/*" style="display:none;" onchange="updateComposerFileLabel(this)">
                <span id="composer-file-name" class="file-status"></span>
                <button id="post-submit-btn" onclick="submitNewPost()" class="glass-btn sm">Post</button>
            </div>
        </div>

        <!-- Instagram-Style Stories Bar -->
        <div class="stories-wrapper">
            <div class="stories-container" id="stories-slider"></div>
        </div>

        <!-- Main Feed -->
        <div id="feed-container"></div>
    </div>

    <!-- EXPLORE VIEW -->
    <div id="explore-view" class="view">
        <div class="header">
            <div class="header-left">Explore</div>
        </div>
        <div class="explore-search-container">
            <div class="explore-search">
                <i class="fa-solid fa-magnifying-glass" style="color: #999;"></i>
                <input type="text" id="explore-search-input" placeholder="Search trends, people, topics...">
            </div>
        </div>

        <!-- X-Style Trends Section -->
        <div class="trends-section">
            <div class="section-title">Trends for you</div>
            <div id="trends-list"></div>
        </div>

        <div class="explore-grid" id="explore-grid"></div>
    </div>

    <!-- MESSAGES VIEW -->
    <div id="messages-view" class="view">
        <div class="header">
            <div class="header-left">Inbox</div>
            <div class="header-right"><i class="fa-solid fa-pen-to-square"></i></div>
        </div>
        <div class="msg-container" id="msg-list"></div>
    </div>

    <!-- CHAT CONVERSATION VIEW -->
    <div id="chat-conversation-view" class="view">
        <div class="chat-header">
            <div class="chat-header-left" onclick="switchView('messages')">
                <i class="fa-solid fa-chevron-left"></i>
                <img id="chat-header-avatar" src="https://picsum.photos/seed/user/100/100" class="chat-avatar">
                <div class="chat-header-info">
                    <span id="chat-user-header" class="chat-header-name">Chat</span>
                    <span class="chat-header-status"><span class="status-dot"></span> Active now</span>
                </div>
            </div>
        </div>

        <div id="chat-messages-container" class="chat-stream"></div>

        <form id="chat-form" class="ig-chat-input-bar" onsubmit="sendChatMessage(event)">
            <label for="chat-file" class="ig-media-btn">
                <i class="fa-solid fa-image"></i>
            </label>
            <input type="file" id="chat-file" accept="image/*,video/*" style="display:none;" onchange="updateChatFileLabel(this)">
            
            <div class="ig-input-wrapper">
                <input type="text" id="chat-message-input" placeholder="Message..." autocomplete="off">
                <span id="chat-file-indicator" class="chat-file-badge hidden"><i class="fa-solid fa-paperclip"></i> Attached</span>
            </div>

            <button type="submit" class="ig-send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <!-- PROFILE VIEW -->
    <div id="profile-view" class="view">
        <div class="header">
            <div class="header-left"><i class="fa-solid fa-lock"></i> <span id="header-handle">@user</span></div>
            <div class="header-right"><i class="fa-solid fa-gear" onclick="switchView('settings')"></i></div>
        </div>
        
        <div class="profile-header">
            <div class="profile-avatar-container">
                <img id="profile-avatar" src="https://picsum.photos/seed/user/300/300" class="profile-avatar" alt="Avatar">
            </div>
            <div class="profile-name-badges">
                <div class="profile-name" id="profile-username">User</div>
                <i class="fa-solid fa-circle-check golden-badge glow-gold"></i>
            </div>
            <div class="profile-bio" id="profile-bio">Digital Creator</div>
        </div>

        <div class="profile-grid" id="profile-grid-section"></div>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="settings-view" class="view">
        <div class="header">
            <div class="header-left" onclick="switchView('profile')">
                <i class="fa-solid fa-chevron-left"></i> <span>Settings</span>
            </div>
        </div>
        <div class="settings-group" style="margin-top: 30px; padding: 20px;">
            <button onclick="handleLogout()" class="glass-btn primary" style="background: #ff3b30; border: none; width: 100%;">
                Log Out
            </button>
        </div>
    </div>

    <!-- COMMENTS DRAWER (INSTAGRAM SHEET STYLE) -->
    <div id="comments-sheet" class="sheet-drawer">
        <div class="sheet-header">
            <div class="sheet-bar"></div>
            <span>Comments</span>
        </div>
        <div id="comments-container" class="sheet-content"></div>
        <form id="comment-form" onsubmit="submitComment(event)" class="sheet-input-bar">
            <input type="text" id="comment-input" placeholder="Add a comment..." required>
            <button type="submit">Post</button>
        </form>
    </div>
    <div id="sheet-backdrop" class="sheet-backdrop" onclick="closeComments()"></div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav" id="main-nav">
        <div class="nav-item active" onclick="switchView('home')" data-target="home"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="switchView('explore')" data-target="explore"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="switchView('messages')" data-target="messages"><i class="fa-solid fa-comment-dots"></i></div>
        <div class="nav-item" onclick="switchView('profile')" data-target="profile"><i class="fa-solid fa-user"></i></div>
    </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
